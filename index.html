<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Calculator</h1>
    <div class="box">
        <div class="display">
            <div id="input_display"></div>
            <div id="output_display"></div>
        </div>
        
        <div class="all_buttons">
            <button id="all_clear">AC</button>
            <button id="clear">C</button>
            <button class="operator" id="mod">%</button>
            <button class="operator" id="divide">&#247</button>
            <button class="digits" id="seven">7</button>
            <button class="digits" id="eight">8</button>
            <button class="digits" id="nine">9</button>
            <button class="operator" id="multiply">x</button>
            <button class="digits" id="four">4</button>
            <button class="digits" id="five">5</button>
            <button class="digits" id="six">6</button>
            <button class="operator" id="minus">-</button>
            <button class="digits" id="one">1</button>
            <button class="digits" id="two">2</button>
            <button class="digits" id="three">3</button>
            <button class="operator" id="plus">+</button>
            <button class="operator" id="plusminus">+/-</button>
            <button class="digits" id="zero">0</button>
            <button id="decimal">.</button>
            <button class="equals" id="equalto">=</button>
        </div>
    </div>
</body>
</html>
